[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "display-project"
version = "0.1.0"
description = "Minimal SOP compliance demonstration video pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
yolo = ["ultralytics>=8.3"]
# Gate-audit YOLO artifact validation needs torch; the rest of the suite runs
# without it (torch-dependent tests skip themselves via importorskip).
torch = ["torch>=2.2"]

[project.scripts]
display-project = "display_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# Default rule set; portability regressions are caught by tests, style by E/F.
select = ["E4", "E7", "E9", "F"]
